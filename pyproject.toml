[project]
name = "rfp-agent"
version = "0.1.0"
description = "RFP RAG 에이전트 (Part3 1팀)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # LangChain / LangGraph
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-openai>=0.2",
    "langchain-ollama>=1.1.0",   # GCP VM 오픈소스 모델
    "langchain-chroma>=0.1",
    "langgraph>=0.2",
    # 벡터DB (서버 없이 로컬 파일로 저장)
    "chromadb>=0.5",
    # 문서 파싱
    "pymupdf>=1.24",   # PDF
    "olefile>=0.47",   # HWP (OLE 구조 읽기)
    "pandas>=2.2",     # 메타데이터 CSV
    # 설정
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    # 데모 UI
    "streamlit>=1.38",
    # API 서버
    "fastapi>=0.162.2",
    "uvicorn[standard]>=0.54.0",
    "syhwp>=0.0.8",
    "docling>=2.150.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",  # 노트북에서 이 가상환경 사용
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfp_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
